# THE PRIVILEGED TIER. Deploys the published feeds to GitHub Pages on a
# curation tag.
#
# This job can write, so it must never run submitted code. Every step below is
# metadata handling: unzipping wheels, reading TOML, querying the PyPI JSON
# API, writing files. Row generation genuinely does not need execution — that
# is the property the whole permission split rests on.
#
# **Do not add a step here that installs-and-imports a candidate library.** The
# load gate lives in verify.yml, which holds no token and no secrets. If a
# library needs to be proven loadable before deploy, it is proven there, on the
# pull request, before the tag exists.

name: deploy

on:
  push:
    tags:
      - "20*"          # curation tags: 2026.08.29, 2026.08.29.1
  workflow_dispatch:
    inputs:
      curation_tag:
        description: "Curation tag to archive under (blank = no archive)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: generate and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the built site to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Determine the curation tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.curation_tag }}" ]; then
            echo "value=${{ github.event.inputs.curation_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Yank check
        # Under PEP 592 a yanked release is ignored by resolvers UNLESS the
        # requirement pins it exactly with `==` — which every stable and latest
        # row does. An author's "do not use this release" is precisely the
        # signal our pinning defeats, so it is checked explicitly, and it is
        # checked here rather than only on the PR because a release can be
        # yanked between merge and tag.
        run: |
          uv run python scripts/verify_lock.py --lock locks/stable.toml --yanks-only
          if [ -f locks/latest.toml ]; then
            uv run python scripts/verify_lock.py --lock locks/latest.toml --yanks-only
          fi

      - name: Fetch the published site
        # The archives are immutable and must survive every deploy, so the
        # existing gh-pages tree is checked out and generated *into*. The
        # archive index is then built by scanning what is actually on disk,
        # which is what keeps it from drifting from what is served.
        #
        # On the very first deploy there is no gh-pages branch, and `_site` must
        # still be its OWN repository. A plain `mkdir` leaves it a directory
        # inside the checked-out main worktree, where `_site/` is gitignored —
        # so the deploy step's `git add -A` stages nothing, `git diff --cached`
        # is empty, and the job exits 0 having published absolutely nothing.
        # That is what happened on the first tag: a green deploy serving 404s.
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add _site origin/gh-pages
          else
            echo "no gh-pages branch yet — bootstrapping an orphan repo in _site"
            mkdir -p _site
            git init -q _site
            git -C _site checkout -q -b gh-pages
          fi

      - name: Generate the site
        run: |
          uv run python scripts/generate_feed.py \
            --out-dir _site \
            --curation-tag "${{ steps.tag.outputs.value }}" \
            --strict

      - name: Check no archive was overwritten
        # An archive is a promise: a subscriber pinned to one must keep getting
        # the same bytes forever. Re-tagging an existing curation tag would
        # quietly rewrite one, so it fails the deploy instead.
        run: |
          cd _site
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            changed=$(git diff --name-only origin/gh-pages -- '*/20*/marketplace.toml' || true)
            if [ -n "$changed" ]; then
              echo "::error::this deploy would rewrite an existing archive:"
              echo "$changed"
              echo "Archives are immutable. Use a new curation tag."
              exit 1
            fi
          fi

      - name: Deploy to gh-pages
        run: |
          cd _site
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The bootstrap repo has no remote of its own; a worktree inherits one.
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          # A generated site is never empty, so an empty index means the tree
          # being staged is not the one that was written — the failure mode this
          # step shipped with. Refuse to report success on it.
          if [ ! -f marketplace.toml ] && [ ! -f stable/marketplace.toml ]; then
            echo "::error::_site holds no generated feed — nothing was staged for deploy."
            exit 1
          fi

          git add -A
          if git diff --cached --quiet && git rev-parse HEAD >/dev/null 2>&1; then
            # A real no-op: the published site already matches, byte for byte.
            echo "published site is already up to date"
            exit 0
          fi
          git commit -m "deploy: ${{ steps.tag.outputs.value }}"
          git push origin HEAD:gh-pages

      - name: Confirm the published URLs
        # The acceptance check from the build plan, run automatically: a deploy
        # that reports success while serving a 404 is the failure this catches.
        #
        # Retried rather than slept-once, because Pages propagation is genuinely
        # slow and a fixed sleep either wastes time or flakes. But it does FAIL
        # at the end: this step exited 0 on every outcome in the first version,
        # which is how a deploy that published nothing at all still went green.
        #
        # Skipped when Pages is not yet enabled — that is a one-time manual step
        # and not something a deploy can or should fix.
        run: |
          base=https://going-haywire.github.io/marketplace
          urls="$base/stable/marketplace.toml $base/latest/marketplace.toml \
                $base/edge/marketplace.toml $base/archives.html"

          for attempt in $(seq 1 10); do
            fail=0
            for url in $urls; do
              curl -sfo /dev/null "$url" || fail=1
            done
            [ "$fail" -eq 0 ] && break
            echo "attempt $attempt: not all URLs serving yet, waiting 30s"
            sleep 30
          done

          for url in $urls; do
            if curl -sfo /dev/null "$url"; then
              echo "ok    $url"
            else
              echo "FAIL  $url"
            fi
          done

          if [ "$fail" -ne 0 ]; then
            if ! curl -sfo /dev/null "$base/"; then
              echo "::warning::Pages is not serving this repo at all — is it enabled \
          (Settings -> Pages -> branch gh-pages, root)? Skipping the check."
              exit 0
            fi
            echo "::error::deploy finished but the published feeds are not being served."
            exit 1
          fi
